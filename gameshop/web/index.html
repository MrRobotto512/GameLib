<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Shop</title>
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/shelf.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f5c451'/%3E%3Cpath d='M16 7l9 9-9 9-9-9z' fill='%231a1630'/%3E%3C/svg%3E">
</head>
<body>
<header class="top">
  <a class="brand" href="#/" data-nav><span class="logo"></span><span class="brand-name">Game Shop</span><span class="brand-sub" id="agent-name"></span></a>
  <nav class="tabs" id="tabs">
    <span class="tv-only key lr">L1</span>
    <a href="#/shelf" data-tab="shelf" data-nav>Shelf</a>
    <a href="#/" data-tab="discover" data-nav>Discover</a>
    <a href="#/departments" data-tab="departments" data-nav>Consoles</a>
    <a href="#/downloads" data-tab="downloads" data-nav>Downloads <span class="badge" id="dl-badge" hidden></span></a>
    <a href="#/ps5" data-tab="ps5" data-nav>On your PS5</a>
    <a href="#/settings" data-tab="settings" data-nav>Settings</a>
    <span class="tv-only key lr">R1</span>
  </nav>
  <div class="top-right">
    <form class="search" id="search-form"><input id="search" type="search" placeholder="Search" autocomplete="off" data-nav></form>
    <button class="chip ps5-chip" id="ps5-chip" title="PS5 connection" data-nav><span class="dot"></span><span id="ps5-chip-text">PS5</span></button>
    <button class="chip" id="view-toggle" title="Retail box or cartridge / disc" data-nav>Box</button>
    <button class="chip" id="tv-toggle" title="TV mode (controller / keyboard)" data-nav>TV</button>
  </div>
</header>
<main id="view" class="view"></main>
<footer class="legend" id="legend">
  <span><b class="key cross">✕</b> Details</span>
  <span><b class="key tri">△</b> Search</span>
  <span><b class="key sq">□</b> Downloads</span>
  <span><b class="key lr">L1</b><b class="key lr">R1</b> Sections</span>
  <span><b class="key circ">○</b> Back</span>
</footer>
<div id="toast" class="toast" hidden></div>
<div id="modal" class="modal" hidden></div>
<script src="/static/shelf.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
