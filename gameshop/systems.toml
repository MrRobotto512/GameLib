thumbs = "Sony_-_PlayStation_Portable"

[[system]]
id = "ps3"
name = "PlayStation 3"
maker = "Sony"
route = "none"
dest = ""
exts = ["iso", "pkg"]
group = "folder"
case = "bd"
color = "#0a0a0a"
thumbs = "Sony_-_PlayStation_3"
note = "No dependable PS3 emulator on the PS5 yet. The library lists these so nothing is lost; downloads are off."

[[system]]
id = "ps4"
name = "PlayStation 4"
maker = "Sony"
route = "dpi"
dest = ""
exts = ["pkg"]
group = "file"
case = "bd"
color = "#1e5bd8"
thumbs = ""
note = "PS4 packages install natively through etaHEN's Direct Package Installer. kstuff must be running."

[[system]]
