# Game Shop systems table.
#
# One [[system]] per console. Fields:
#   id        ES-DE folder name (what RetroArch's content/<id>/ uses)
#   name      department name in the store
#   maker     shelf grouping
#   route     ftp (copy file into dest) | dpi (PS4 pkg install) | none (no PS5 target yet)
#   dest      default PS5 folder; "{ra}" is the RetroArch title folder from settings.
#             Empty with route=ftp means "you must choose a folder in Settings".
#   exts      file extensions that are games for this system (lowercase, no dot)
#   group     how multi-file games are grouped: file | cue | folder
#   case      3D template: jewel | dvd | bd | cart-n64 | cart-snes | cart-nes | cart-gb |
#             cart-genesis | cart-sms | cart-ds | cart-2600 | cart-lynx | mini-dvd | umd |
#             arcade | switch | generic
#   color     brand colour for generated covers and tile tints
#   thumbs    libretro-thumbnails repository name ("" = none)
#   core      libretro core name RetroArch's forwarder tiles use ("" = no tiles)
#   note      shown on the department page when route is none or dest is empty

ra_default = "/data/homebrew/PPSA99169"

# ---------------- Sony ----------------
[[system]]
id = "psx"
core = "mednafen_psx_hw"
name = "PlayStation"
maker = "Sony"
route = "ftp"
dest = "{ra}/content/psx"
exts = ["chd", "cue", "pbp", "m3u", "ecm", "iso", "img"]
group = "cue"
case = "jewel"
color = "#9aa3b2"
thumbs = "Sony_-_PlayStation"

[[system]]
id = "ps2"
core = "pcsx2"
name = "PlayStation 2"
